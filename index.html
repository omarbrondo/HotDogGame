<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <link rel="icon" href="data:,">
  <title>Perro Callejero</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10131a;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      background: #000;
    }
    .touch {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    .touch.on { display: flex; }
    .pad {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }
    .touch button {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 26px;
      font-weight: bold;
      touch-action: none;
    }
    .touch button:active { background: rgba(255, 255, 255, 0.4); }
    .touch button[data-key="pause"] {
      width: 56px;
      height: 56px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <div id="touch" class="touch">
    <div class="pad">
      <button data-key="left" aria-label="Izquierda">◀</button>
      <button data-key="right" aria-label="Derecha">▶</button>
    </div>
    <div class="pad">
      <button data-key="pause" aria-label="Pausa">II</button>
      <button data-key="attack" aria-label="Lanzar roca">✊</button>
      <button data-key="jump" aria-label="Saltar">⤒</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
